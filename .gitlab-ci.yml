image: ghcr.io/prefix-dev/pixi:latest

variables:
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: "fastest"

test:
  script:
    - pixi run pytest -v
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .pixi

run docs:
  script:
    - pixi run docs-build
  artifacts:
    paths:
      - public
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .pixi
  pages:
    publish: public

run pre-commit:
  variables:
    PRE_COMMIT_HOME: $CI_PROJECT_DIR/.pre-commit-cache
  script:
    - pixi run git config --global --add safe.directory $CI_PROJECT_DIR
    - pixi run pre-commit run --all-files
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .pre-commit-cache
      - .pixi
