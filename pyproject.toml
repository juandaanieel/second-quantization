[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "second_quantization"
description = "Converting second quantized operators to matrix form and back"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Quantum Tinkerers" }]
license = { file = "LICENSE" }
keywords = ["second quantization", "quantum", "operators", "linear algebra"]
dynamic = ["version"]

dependencies = [
  "numpy>=2.2.0",
  "sympy>=1.13.0",
  "scipy>=1.14.0",
  "packaging>=22.0",
]

classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: BSD License",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
"Documentation" = "https://qt.pages.quantumtinkerer.group/second_quantization/index.html"
"Repository" = "https://gitlab.kwant-project.org/qt/second_quantization"
"Bug Tracker" = "https://gitlab.kwant-project.org/qt/second_quantization/-/issues"

[project.optional-dependencies]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.6",
  "mkdocstrings>=0.30",
  "mkdocstrings-python>=1.8",
  "mkdocs-bibtex>=4.4",
  "markdown>=3.6",
  "pymdown-extensions>=10.14",
]
test = [
  "pytest>=8.3",
  "pytest-cov>=6",
  "pytest-randomly>=3.15",
  "pytest-repeat>=0.9",
  "pytest-regressions",
  "ruff>=0.9",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "second_quantization/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["second_quantization"]

[tool.hatch.build.targets.sdist]
include = ["second_quantization", "README.md", "LICENSE", "pyproject.toml"]

# Optional: keep artifacts slim
[tool.hatch.build]
exclude = ["tests", "docs", ".github", ".gitlab-ci.yml"]

[tool.codespell]
skip = "*.cls,*.bst,*.bib,*.lock"
ignore-words-list = "nwo,groth,braket,bra,ket,Araya,Day"

[tool.pytest.ini_options]
addopts = ["--cov=second_quantization", "--cov-report=term-missing", "--cov-report=xml:cov.xml"]

[tool.coverage.run]
relative_files = true

[tool.coverage.xml]
output = "cov.xml"

# ---------- Pixi (envs + tasks) ----------
[tool.pixi.workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

# Shared dev tooling for the default env
[tool.pixi.dependencies]
uv = ">=0.13.4"
certifi = ">=2026.10.19"
ca-certificates = ">=2026.10.19"
python = ">=3.12,<3.13"
numpy = ">=2.2.0,<2.4.0"
sympy = ">=1.13.0,<1.15.0"
scipy = ">=1.14.0,<1.16.0"
pytest = ">=8.3.4,<9"
pytest-cov = ">=6,<7"
ruff = ">=0.9.6,<0.10"
pre-commit = ">=4.0.1,<5"
git = ">=2.47.1,<3"
matplotlib-base = ">=3.10,<4"

# PyPI install of your package in editable mode for dev
[tool.pixi.pypi-dependencies]
second_quantization = { path = ".", editable = true }

# Optional feature for docs only
[tool.pixi.feature.docs.dependencies]
mkdocs = ">=1.6.1,<2"
mkdocs-material = ">=9.6.22,<10"
mkdocs-bibtex = ">=4.4.0,<5"
mkdocstrings = ">=0.30.1,<0.31"
mkdocstrings-python = ">=1.18.2,<2"
markdown = ">=3.6,<4"
pymdown-extensions = ">=10.14.3,<11"
openfermion = ">=0.11, <0.12"
qutip = ">=5.2.2,<6"
matplotlib = ">=3.10.8,<4"

[tool.pixi.feature.docs.pypi-dependencies]
mkdocs-execute-plugin = ">=0.0.9,<0.0.10"

[tool.pixi.feature.docs.target.linux-64.pypi-dependencies]
quspin = ">=1.0.0,<2"

[tool.pixi.feature.docs.target.osx-arm64.pypi-dependencies]
quspin = ">=1.0.0,<2"

[tool.pixi.feature.docs.tasks]
docs-serve = "mkdocs serve"
docs-build = "mkdocs build --site-dir public"

[tool.pixi.feature.publish.dependencies]
hatch = ">=1.7.0,<1.13"
hatch-vcs = ">=0.4.0,<0.5"
git = "*"

[tool.pixi.feature.publish.tasks]
build = "hatch build"
publish = "hatch publish -u __token__"

[tool.pixi.environments]
default = { solve-group = "default" }
docs    = { features = ["docs"], solve-group = "default" }
publish = { features = ["publish"], solve-group = "default" }

[tool.pixi.tasks]
tests = {cmd = "pytest -v"}
format = "ruff format ."
lint = "ruff check ."
pre-commit = "pre-commit"
