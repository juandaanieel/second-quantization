[project]
authors = [{name = "Quantum Tinkerers"}]
description = "Converting second quantized operators to matrix form and back"
name = "second_quantization"
dynamic = ["version"]
# This project follows https://scientific-python.org/specs/spec-0000/
requires-python = ">= 3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sympy>=1.12",
    "packaging>=22.0",  # For version parsing
]
readme = "README.md"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: BSD License",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[tool.hatch.version]
source = "vcs"
[tool.hatch.build.hooks.vcs]
version-file = "second_quantization/_version.py"
[tool.hatch.build.targets.sdist]
include = [
    "second_quantization",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
second_quantization = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
numpy = "*"
scipy = "*"
sympy = "*"
packaging = "*"
git = "*"
