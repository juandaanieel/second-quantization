[project]
authors = [{name = "Quantum Tinkerers"}]
description = "Converting second quantized operators to matrix form and back"
name = "second_quantization"
dynamic = ["version"]
# This project follows https://scientific-python.org/specs/spec-0000/

requires-python = ">= 3.11"
dependencies = [
    "numpy>=1.24",
    "sympy>=1.13",
    "scipy>=1.8",
    # Documentation dependencies
    "sphinx>=6.0.0,<8",
    "myst-nb>=1.2.0,<2",
    "sphinx-book-theme>=1.1.0,<2",
    "sphinx-copybutton>=0.5.0,<1",
    "sphinx-design>=0.6.0,<1",
    "linkify-it-py>=2.0.0,<3",
]
readme = "README.md"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: BSD License",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[tool.hatch.version]
source = "vcs"
[tool.hatch.build.hooks.vcs]
version-file = "second_quantization/_version.py"
[tool.hatch.build.targets.sdist]
include = [
    "second_quantization",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64", 'osx-64']

[tool.pixi.environments]
default = { solve-group = "default" }
docs = { features = ["docs"], solve-group = "mid" }

[tool.pixi.pypi-dependencies]
second_quantization = { path = ".", editable = true }
quspin = { version = ">=1.0.0,<2", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
ipykernel = ">=6.29.5,<7.0.0"
numpy = ">=2.0.0,<2.1.0"
sympy = ">=1.13.0,<1.15.0"
git = ">=2.47.1,<3"
pre-commit = ">=4.0.1,<5"
pytest = ">=8.3.4,<9"
matplotlib = ">=3.10.3,<4"
openfermion = ">=0.11.0,<0.12"
jax = ">=0.6.0,<0.7"

[tool.codespell]
skip = "*.cls,*.bst,*.bib,*.lock"
ignore-words-list = "nwo,groth,braket,bra,ket"

[tool.pixi.feature.docs.tasks.docs-build]
cmd = "cd docs && sphinx-build -b html . build/html"
