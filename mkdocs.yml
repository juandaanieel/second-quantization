site_name: Second Quantization
site_description: Converting second quantized operators to matrix form and back
site_url: https://second-quantization.readthedocs.io/
docs_dir: docs
site_dir: public

repo_name: qt/second_quantization
repo_url: https://gitlab.kwant-project.org/qt/second_quantization

theme:
  name: material
  palette:
    primary: black
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - mkdocstrings
  - search
  - execute

markdown_extensions:
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.superfences
  - footnotes

extra_javascript:
  - javascript/katex.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.7/katex.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.7/contrib/auto-render.min.js

extra_css:
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.7/katex.min.css

nav:
  - Home: index.md
  - Tutorials:
      - Interacting Kitaev Chain: tutorials/interacting_kitaev.md
  - Performance: performance.md
  - API Reference: API.md
